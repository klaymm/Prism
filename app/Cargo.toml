[package]
name = "prism"
description = "Prism — lightweight VLESS + Reality client for Windows"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
prism-core = { path = "../crates/prism-core" }
prism-ui = { path = "../crates/prism-ui" }
prism-win = { path = "../crates/prism-win" }
slint = { workspace = true, features = ["system-tray"] }
windows-sys = { workspace = true }
serde_json = { workspace = true }
arboard = { version = "3.6", default-features = false }
rfd = { version = "0.16", default-features = false }

[build-dependencies]
slint-build = { workspace = true }
embed-resource = "3"
