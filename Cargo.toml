[workspace]
resolver = "3"
members = ["crates/prism-win", "crates/prism-core", "crates/prism-ui", "app", "installer"]

[workspace.package]
version = "0.4.0"
authors = ["klaymm"]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "unstable-winit-030",
  "accessibility",
] }
slint-build = "=1.18.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
